name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. routes-2026-11-17"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build route files
        run: python scripts/build_routes.py
      - name: Validate generated JSON
        run: |
          python -m json.tool dist/amnezia-routes.json > /dev/null
          python -m json.tool dist/windscribe-routes.json > /dev/null
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=( "$RELEASE_TAG" dist/amnezia-routes.json dist/windscribe-routes.json --title "$RELEASE_TAG" --generate-notes )
          if [ "$PRERELEASE" = "true" ]; then args+=( --prerelease ); fi
          gh release create "${args[@]}"
